schema_version: "1.0"

extension:
  id: agency-agents-design
  name: "Agency Agents — Design"
  version: "1.0.0"
  description: "Design division specialists from the Agency Agents collection (9 agents)."
  author: spec-kit-community
  repository: "https://github.com/mnriem/spec-kit-extensions"
  license: MIT
  homepage: "https://github.com/mnriem/spec-kit-extensions"

requires:
  speckit_version: ">=0.2.0"

provides:
  commands:
    - name: speckit.agency-agents-design.brand-guardian
      file: commands/brand-guardian.md
      description: "Expert brand strategist and guardian specializing in brand identity development, consistency maintenance, and strategic brand positioning"

    - name: speckit.agency-agents-design.image-prompt-engineer
      file: commands/image-prompt-engineer.md
      description: "Expert photography prompt engineer specializing in crafting detailed, evocative prompts for AI image generation. Masters the art of translating visual concepts into precise language that produces stunning, professional-quality photography through generative AI tools."

    - name: speckit.agency-agents-design.inclusive-visuals-specialist
      file: commands/inclusive-visuals-specialist.md
      description: "Representation expert who defeats systemic AI biases to generate culturally accurate, affirming, and non-stereotypical images and video."

    - name: speckit.agency-agents-design.persona-walkthrough
      file: commands/persona-walkthrough.md
      description: "Simulate cognitive walkthroughs of web pages from a defined persona's psychological perspective — captures emotional reactions and rational thought at each scroll position, then delivers structured CRO reports grounded in LIFT, Cialdini, and Fogg frameworks"

    - name: speckit.agency-agents-design.ui-designer
      file: commands/ui-designer.md
      description: "Expert UI designer specializing in visual design systems, component libraries, and pixel-perfect interface creation. Creates beautiful, consistent, accessible user interfaces that enhance UX and reflect brand identity"

    - name: speckit.agency-agents-design.ux-architect
      file: commands/ux-architect.md
      description: "Technical architecture and UX specialist who provides developers with solid foundations, CSS systems, and clear implementation guidance"

    - name: speckit.agency-agents-design.ux-researcher
      file: commands/ux-researcher.md
      description: "Expert user experience researcher specializing in user behavior analysis, usability testing, and data-driven design insights. Provides actionable research findings that improve product usability and user satisfaction"

    - name: speckit.agency-agents-design.visual-storyteller
      file: commands/visual-storyteller.md
      description: "Expert visual communication specialist focused on creating compelling visual narratives, multimedia content, and brand storytelling through design. Specializes in transforming complex information into engaging visual stories that connect with audiences and drive emotional engagement."

    - name: speckit.agency-agents-design.whimsy-injector
      file: commands/whimsy-injector.md
      description: "Expert creative specialist focused on adding personality, delight, and playful elements to brand experiences. Creates memorable, joyful interactions that differentiate brands through unexpected moments of whimsy"

tags:
  - agency-agents
  - agents
  - design
  - experimental
