schema_version: "1.0"

extension:
  id: mattpocock-misc
  name: "Matt Pocock Misc"
  version: "1.0.0"
  description: "Matt Pocock's occasional-use skills — git guardrails, pre-commit setup, exercise scaffolding, and shoehorn migration."
  author: mattpocock
  repository: "https://github.com/mnriem/spec-kit-extensions"
  license: MIT
  homepage: "https://github.com/mnriem/spec-kit-extensions"

requires:
  speckit_version: ">=0.2.0"

provides:
  commands:
    - name: speckit.mattpocock-misc.git-guardrails-claude-code
      file: commands/git-guardrails-claude-code.md
      description: "Set up Claude Code hooks to block dangerous git commands (push, reset --hard, clean, branch -D, etc.) before they execute. Use when user wants to prevent destructive git operations, add git safety hooks, or block git push/reset in Claude Code."

    - name: speckit.mattpocock-misc.migrate-to-shoehorn
      file: commands/migrate-to-shoehorn.md
      description: "Migrate test files from `as` type assertions to @total-typescript/shoehorn. Use when user mentions shoehorn, wants to replace `as` in tests, or needs partial test data."

    - name: speckit.mattpocock-misc.scaffold-exercises
      file: commands/scaffold-exercises.md
      description: "Create exercise directory structures with sections, problems, solutions, and explainers that pass linting. Use when user wants to scaffold exercises, create exercise stubs, or set up a new course section."

    - name: speckit.mattpocock-misc.setup-pre-commit
      file: commands/setup-pre-commit.md
      description: "Set up Husky pre-commit hooks with lint-staged (Prettier), type checking, and tests in the current repo. Use when user wants to add pre-commit hooks, set up Husky, configure lint-staged, or add commit-time formatting/typechecking/testing."

tags:
  - misc
  - tooling
  - setup
  - skills
