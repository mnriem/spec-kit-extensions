schema_version: "1.0"

extension:
  id: mattpocock-engineering
  name: "Matt Pocock Engineering"
  version: "1.0.0"
  description: "Matt Pocock's engineering skills for daily code work — TDD, code review, diagnosing bugs, domain modeling, prototyping, research, and issue/PRD workflows."
  author: mattpocock
  repository: "https://github.com/mnriem/spec-kit-extensions"
  license: MIT
  homepage: "https://github.com/mnriem/spec-kit-extensions"

requires:
  speckit_version: ">=0.2.0"

provides:
  commands:
    - name: speckit.mattpocock-engineering.ask-matt
      file: commands/ask-matt.md
      description: "Ask which skill or flow fits your situation. A router over the skills in this repo."

    - name: speckit.mattpocock-engineering.code-review
      file: commands/code-review.md
      description: "Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes — Standards (does the code follow this repo's documented coding standards?) and Spec (does the code match what the originating issue/PRD asked for?). Runs both reviews in parallel sub-agents and reports them side by side. Use when the user wants to review a branch, a PR, work-in-progress changes, or asks to \"review since X\"."

    - name: speckit.mattpocock-engineering.codebase-design
      file: commands/codebase-design.md
      description: "Shared vocabulary for designing deep modules. Use when the user wants to design or improve a module's interface, find deepening opportunities, decide where a seam goes, make code more testable or AI-navigable, or when another skill needs the deep-module vocabulary."

    - name: speckit.mattpocock-engineering.diagnosing-bugs
      file: commands/diagnosing-bugs.md
      description: "Diagnosis loop for hard bugs and performance regressions. Use when the user says \"diagnose\"/\"debug this\", or reports something broken/throwing/failing/slow."

    - name: speckit.mattpocock-engineering.domain-modeling
      file: commands/domain-modeling.md
      description: "Build and sharpen a project's domain model. Use when the user wants to pin down domain terminology or a ubiquitous language, record an architectural decision, or when another skill needs to maintain the domain model."

    - name: speckit.mattpocock-engineering.grill-with-docs
      file: commands/grill-with-docs.md
      description: "A relentless interview to sharpen a plan or design, which also creates docs (ADR's and glossary) as we go."

    - name: speckit.mattpocock-engineering.implement
      file: commands/implement.md
      description: "Implement a piece of work based on a PRD or set of issues."

    - name: speckit.mattpocock-engineering.improve-codebase-architecture
      file: commands/improve-codebase-architecture.md
      description: "Scan a codebase for deepening opportunities, present them as a visual HTML report, then grill through whichever one you pick."

    - name: speckit.mattpocock-engineering.prototype
      file: commands/prototype.md
      description: "Build a throwaway prototype to answer a design question. Use when the user wants to sanity-check whether a state model or logic feels right, or explore what a UI should look like."

    - name: speckit.mattpocock-engineering.research
      file: commands/research.md
      description: "Investigate a question against high-trust primary sources and capture the findings as a Markdown file in the repo. Use when the user wants a topic researched, docs or API facts gathered, or reading legwork delegated to a background agent."

    - name: speckit.mattpocock-engineering.resolving-merge-conflicts
      file: commands/resolving-merge-conflicts.md
      description: "Use when you need to resolve an in-progress git merge/rebase conflict."

    - name: speckit.mattpocock-engineering.setup-matt-pocock-skills
      file: commands/setup-matt-pocock-skills.md
      description: "Configure this repo for the engineering skills — set up its issue tracker, triage label vocabulary, and domain doc layout. Run once before first use of the other engineering skills."

    - name: speckit.mattpocock-engineering.tdd
      file: commands/tdd.md
      description: "Test-driven development. Use when the user wants to build features or fix bugs test-first, mentions \"red-green-refactor\", or wants integration tests."

    - name: speckit.mattpocock-engineering.to-issues
      file: commands/to-issues.md
      description: "Break a plan, spec, or PRD into independently-grabbable issues on the project issue tracker using tracer-bullet vertical slices."

    - name: speckit.mattpocock-engineering.to-prd
      file: commands/to-prd.md
      description: "Turn the current conversation into a PRD and publish it to the project issue tracker — no interview, just synthesis of what you've already discussed."

    - name: speckit.mattpocock-engineering.triage
      file: commands/triage.md
      description: "Move issues and external PRs through a state machine of triage roles — categorise, verify, grill if needed, and write agent-ready briefs."

tags:
  - engineering
  - workflow
  - tdd
  - code-review
  - skills
